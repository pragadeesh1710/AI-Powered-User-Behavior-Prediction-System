{% extends "base.html" %}
{% block title %}Register | LearnHub{% endblock %}
{% block content %}<section class="auth-wrap"><div class="auth-card"><span class="eyebrow">GET STARTED</span><h1>Create your account</h1><p>Start learning and let your activity shape your recommendations.</p><form method="POST"><label>Name<input name="name" required></label><label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" minlength="6" required></label><button class="btn full" type="submit">Create Account</button></form><p class="auth-foot">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p></div></section>{% endblock %}
